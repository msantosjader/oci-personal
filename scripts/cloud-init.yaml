k#cloud-config

# 1. Atualiza o sistema assim que a máquina ligar
package_update: true
package_upgrade: true

# 2. Garante que pacotes básicos estejam instalados
packages:
  - curl
  - wget
  - git

# 3. Comandos que serão executados como root
runcmd:
  # --- Docker ---
  - echo "Instalando Docker..."
  - curl -fsSL https://get.docker.com | sh
  # Adiciona o usuário padrão da OCI (ubuntu) ao grupo docker para não precisar usar 'sudo docker'
  - usermod -aG docker ubuntu

  # --- uv (Gerenciador Python da Astral) ---
  - echo "Instalando uv..."
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - ln -s /root/.cargo/bin/uv /usr/local/bin/uv
  - ln -s /root/.cargo/bin/uvx /usr/local/bin/uvx

  # --- Tailscale ---
  - echo "Instalando e autenticando o Tailscale..."
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=${tailscale_key} --accept-routes

  # --- Netdata ---
  - echo "Instalando e conectando o Netdata Cloud..."
  - curl https://get.netdata.cloud/kickstart.sh > /tmp/netdata-kickstart.sh
  - sh /tmp/netdata-kickstart.sh --stable-channel --claim-token ${netdata_token} --claim-rooms ${netdata_rooms} --claim-url https://app.netdata.cloud
