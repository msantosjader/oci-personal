#cloud-config

# 1. Atualiza o sistema assim que a máquina ligar
package_update: true
package_upgrade: true

# 2. Garante que pacotes básicos estejam instalados
packages:
  - curl
  - git

# 3. Comandos que serão executados como root
runcmd:
  # --- Docker ---
  - echo "Instalando Docker..."
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu

  # --- uv ---
  - echo "Instalando uv..."
  - curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/usr/local/bin" UV_NO_MODIFY_PATH=1 sh

  # --- Tailscale ---
  - echo "Instalando e autenticando o Tailscale..."
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=${tailscale_auth_key} --accept-routes --auto-update

  # --- Netdata ---
  - echo "Instalando e conectando o Netdata Cloud..."
  - curl https://get.netdata.cloud/kickstart.sh > /tmp/netdata-kickstart.sh
  - sh /tmp/netdata-kickstart.sh --stable-channel --claim-token ${netdata_claim_token} --claim-rooms ${netdata_claim_rooms} --claim-url https://app.netdata.cloud

# 4. Reinicia uma vez apos o primeiro boot para ativar o kernel atualizado
#    pelo package_upgrade (evita warning de reboot pendente no Netdata)
power_state:
  mode: reboot
  condition: true
  timeout: 30